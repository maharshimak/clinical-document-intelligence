[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-document-intelligence"
description = "Rule-based extraction and validation of structured study fields from synthetic clinical-style text."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pypdf>=6.0.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10","ruff>=0.16.7,<1"]
document-ai = ["docling>=2.130.0,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
